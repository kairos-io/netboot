name: Tests
on:
  pull_request:
  push:
    branches:
      - main
concurrency:
  group: ci-tests-${{ github.head_ref || github.ref }}-${{ github.repository }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Install test deps
        run: sudo apt-get update && sudo apt-get install -y atftp
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Run tests
        env:
          CGO_ENABLED: 1
        run: |
          # Without pipefail the step reports go-junit-report's status, which is 0
          # for any report it could parse, failing suite or not.
          set -o pipefail
          go install github.com/jstemmer/go-junit-report/v2@latest
          go test -v -coverprofile=coverage.out ./... | go-junit-report > junit.xml
      - name: Codecov
        # Keep uploading once the step above can fail: a red suite is exactly
        # when its report is worth reading. continue-on-error keeps the upload
        # out of the verdict: this job is the repo's test gate, and a Codecov
        # outage is not a test failure. fail_ci_if_error is not enough on its
        # own, because a transport error can escape the action as an unhandled
        # exception, which exits non-zero whatever that input says.
        if: always()
        continue-on-error: true
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: ./coverage.out
      - name: Upload test results to Codecov
        # codecov-action with report_type: test_results replaces the retired
        # test-results-action, which is what failed this job on an SSL
        # handshake error while the suite itself was green.
        if: always()
        continue-on-error: true
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: ./junit.xml
          report_type: test_results
